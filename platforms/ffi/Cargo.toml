[package]
name = "tacit-ffi"
version = "0.10.10"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/tacit"
description = "C interface of the input method for the macOS and Linux text services"

[lib]
name = "tacit_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
japanese = ["tacit-core/japanese"]

[dependencies]
tacit-core = { path = "../../crates/core", features = ["embedded-en", "embedded-ko"] }
