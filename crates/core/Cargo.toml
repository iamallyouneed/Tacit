[package]
name = "tacit-core"
version = "0.10.10"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/tacit"

[features]
japanese = []
# Packs carried inside the binary (Android, the CLI, the tests). The Windows text service
# reads the installed packs instead.
embedded-en = []
embedded-ko = []
embedded-ja = ["japanese"]
# Lets the lab override the code-switch weights from the environment (TS_PARAMS="k=v,...").
tuning = []
embedded-packs = ["embedded-en", "embedded-ko", "embedded-ja"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tacit-core = { path = ".", features = ["embedded-en", "embedded-ko"] }
tacit-packgen = { path = "../packgen" }

[build-dependencies]
tacit-packgen = { path = "../packgen" }
