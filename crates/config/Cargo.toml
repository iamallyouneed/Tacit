[package]
name = "tacit-config"
version = "0.10.10"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/tacit"

[lib]
name = "tacit_config"

[[bin]]
name = "tacit-config"
path = "src/main.rs"

[features]
japanese = ["tacit-core/japanese"]

[dependencies]
tacit-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
tiny_http = "0.12"
getrandom = "0.3"

[dev-dependencies]
tacit-packgen = { path = "../packgen" }

[target.'cfg(windows)'.dependencies]
# UI_Input_KeyboardAndMouse is required: TF_INPUTPROCESSORPROFILE / GetActiveProfile used by
# ime.rs only resolve with it enabled (verified by removing it: E0425/E0599).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices"] }
