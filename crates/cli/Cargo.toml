[package]
name = "tacit-cli"
version = "0.10.10"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/tacit"

[[bin]]
name = "tacit"
path = "src/main.rs"

[features]
# Embeds the Japanese pack too (10 MB), for tuning without installing it.
japanese = ["tacit-core/embedded-ja"]

[dependencies]
tacit-core = { path = "../core", features = ["embedded-en", "embedded-ko"] }
