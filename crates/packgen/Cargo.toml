[package]
name = "tacit-packgen"
version = "0.10.10"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/iamallyouneed/tacit"

[lib]
name = "tacit_packgen"

[[bin]]
name = "build-packs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
